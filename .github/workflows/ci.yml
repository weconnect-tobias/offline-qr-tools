name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 5 * * 1" # weekly: catch new advisories for the vendored libraries

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    # Pinned instead of ubuntu-latest: Playwright's system dependencies are tied to the
    # distribution, so a silent runner migration could break the browser tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # The published site and release zip are built from the same file list; fail early if
      # index.html references something the build would leave out.
      - run: bash tools/build-site.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  dependencies:
    name: Vendored libraries (checksums + advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check-Dependencies.ps1
        shell: pwsh
        run: |
          ./tools/Check-Dependencies.ps1
          # 0 = OK, 1 = update available (informational), 2 = advisory/checksum problem, 3 = error
          if ($LASTEXITCODE -ge 2) { exit $LASTEXITCODE }
          exit 0
